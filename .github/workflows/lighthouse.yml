# 每周一用 Lighthouse 测三个代表页面。任一项得分低于 0.8 → 运行失败 → GitHub 发邮件。分数写在运行页面的 Summary 里。
name: Lighthouse

on:
  schedule:
    - cron: "20 14 * * 1"   # 每周一 UTC 14:20
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Lighthouse
        run: |
          cat > lighthouserc.json <<'JSON'
          {
            "ci": {
              "collect": {
                "url": [
                  "https://backlashjournal.com/",
                  "https://backlashjournal.com/articles/lake-simcoe-45-years-of-water-data/",
                  "https://backlashjournal.com/guides/ontario-fmz-16-bass-walleye-season/"
                ],
                "numberOfRuns": 2,
                "settings": { "chromeFlags": "--no-sandbox" }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["error", { "minScore": 0.8, "aggregationMethod": "median-run" }],
                  "categories:accessibility": ["error", { "minScore": 0.8, "aggregationMethod": "median-run" }],
                  "categories:best-practices": ["error", { "minScore": 0.8, "aggregationMethod": "median-run" }],
                  "categories:seo": ["error", { "minScore": 0.8, "aggregationMethod": "median-run" }]
                }
              },
              "upload": { "target": "filesystem", "outputDir": "lhci" }
            }
          }
          JSON
          set +e
          npx --yes @lhci/cli@0.15.1 autorun
          status=$?
          set -e
          node -e '
            const m = require("./lhci/manifest.json");
            const rows = {};
            for (const r of m) { if (!r.isRepresentativeRun) continue; rows[r.url] = r.summary; }
            const f = v => v == null ? "—" : Math.round(v * 100);
            let out = "## Lighthouse 得分（满分 100，低于 80 算失败）\n\n| 页面 | 性能 | 无障碍 | 最佳实践 | SEO |\n|---|---|---|---|---|\n";
            for (const [u, s] of Object.entries(rows)) out += `| ${u.replace("https://backlashjournal.com", "") || "/"} | ${f(s.performance)} | ${f(s.accessibility)} | ${f(s["best-practices"])} | ${f(s.seo)} |\n`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            console.log(out);
          '
          exit $status
